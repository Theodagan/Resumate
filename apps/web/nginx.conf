server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    server_tokens off;

    # Baseline headers for proxied PocketBase responses, which already carry their
    # own nosniff/X-Frame-Options. A location that declares its own add_header
    # drops these, so the SPA block repeats them.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Proxy PocketBase API and admin UI
    location /api/ {
        proxy_pass http://pocketbase:${POCKETBASE_INTERNAL_PORT}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_/ {
        proxy_pass http://pocketbase:${POCKETBASE_INTERNAL_PORT}/_/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA — fallback all unmatched routes to index.html.
    # The CSP is scoped here so the PocketBase dashboard under /_/ keeps its own
    # inline assets. Public CVs render user content, so scripts stay 'self'-only;
    # styles allow inline for Angular component styles and Google Fonts (supa template).
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
