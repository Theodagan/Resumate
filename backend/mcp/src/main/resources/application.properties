spring.application.name=resumate-mcp

server.port=${PORT:${MCP_INTERNAL_PORT:8081}}

spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=resumate-mcp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.instructions=Use these Resumate tools when the user asks to tailor, craft, adapt, customize, or generate a resume/CV for a specific job listing or job description. 1) Call listTemplates first and use exactly one returned template id. 2) Call listProfileMaterial to retrieve the authenticated user's existing material and use only returned record ids. 3) Review all returned material together to form a holistic portrait before selecting records. 4) Select the records that best evidence fit; do not invent qualifications or experience and do not create new source records in this CV-tailoring workflow. 5) Derive profileName as a coherent middle ground between the user's specialization and the offer. Do not copy the job offer listing title verbatim and never include the user's name in profileName. 6) Only after every other selection is final, draft professionalSummary. 7) Call createTailoredCvProfile with label, profileName, professionalSummary, template id, selected record ids, and an idempotencyKey scoped to the offer. Treat deduplicated responses as normal success. Use updateCvProfile for existing profiles. Separately, when the user asks to record authentic experience and the account has enabled material tools, you may create or update projects, achievements, skills, jobs, degrees, and hobbies. Never fabricate source material or tailor it to a job offer. Ask the user to approve the exact write before setting userConfirmed=true; that flag is not independent proof of human consent. Never create material as a step in the CV-tailoring workflow.
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=true
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp


resumate.frontend.base-url=${SERVICE_FQDN_FRONTEND:${FRONTEND_BASE_URL:http://localhost:${FRONTEND_PORT:4200}}}
resumate.pocketbase.base-url=${POCKETBASE_BASE_URL:http://pocketbase:${POCKETBASE_INTERNAL_PORT:8090}}
resumate.pocketbase.service-user-email=${POCKETBASE_SERVICE_USER_EMAIL:}
resumate.pocketbase.service-user-password=${POCKETBASE_SERVICE_USER_PASSWORD:}

resumate.oauth.public-base-url=${MCP_PUBLIC_BASE_URL}
resumate.oauth.jwk=${MCP_OAUTH_JWK}
resumate.oauth.access-token-ttl=${MCP_OAUTH_ACCESS_TOKEN_TTL:1h}
resumate.oauth.refresh-token-ttl=${MCP_OAUTH_REFRESH_TOKEN_TTL:90d}
resumate.oauth.allowed-redirect-uri-patterns=${MCP_OAUTH_ALLOWED_REDIRECT_URI_PATTERNS:https://claude.ai/*}

resumate.mcp.idempotency.ttl=5m
